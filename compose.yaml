services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: dev
    image: noting-app:dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app:z
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=19&charset=utf8
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
    extra_hosts:
      - host.containers.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy

  node:
    image: docker.io/library/node:${NODE_VERSION:-24}-alpine
    working_dir: /app
    command: sh -c "corepack enable && yarn install && yarn dev"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    ports:
      - "5173:5173"
    volumes:
      - .:/app:z

  database:
    image: docker.io/library/postgres:${POSTGRES_VERSION:-19}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  database_data:
