; Ustawienia deweloperskie
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Tryb Xdebug ustawia zmienna XDEBUG_MODE (domyślnie "debug", "off" wyłącza).
; Sesja startuje po wyzwalaczu: parametr/cookie XDEBUG_TRIGGER
; (np. rozszerzenie przeglądarki "Xdebug helper") lub XDEBUG_TRIGGER=1 dla CLI.
xdebug.start_with_request = trigger
xdebug.client_host = host.containers.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0
xdebug.log_level = 0
